[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coliday-cli"
version = "0.1.0"
description = "Claude Code 팀장/서브에이전트 작업을 실행하고 추적하는 CLI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["textual>=8,<9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
coliday = "coliday.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
